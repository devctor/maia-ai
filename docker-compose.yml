services:
  postgres:
    image: postgres:17-alpine
    container_name: maia-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maia}
      POSTGRES_DB: ${POSTGRES_DB:-maia_care}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maia} -d ${POSTGRES_DB:-maia_care}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
